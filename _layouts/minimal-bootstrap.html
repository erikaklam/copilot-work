<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal Bootstrap Page</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* Minimal custom styles */
      body { padding-top: 1rem; padding-bottom: 1rem; }
      .title-section { text-align: center; padding: 1rem 0; }
      .index-section { background: #f8f9fa; padding: 1rem; min-height: 200px; }
      .content-section { padding: 1rem; }
      .footer-section { background: #f1f3f5; text-align: center; padding: 0.75rem 0; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="title-section">
        <h1 class="h3">Minimal Bootstrap Layout</h1>
      </header>

      <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
        <div class="container-fluid px-0">
          <a class="navbar-brand" href="#">Brand</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">About</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <main>
        <div class="row">
          <aside class="col-md-3 index-section"> 
            <h2 class="h5">Index</h2>
            <ul class="nav flex-column">
              <li class="nav-item"><a class="nav-link" href="#">Topic 1</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Topic 2</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Topic 3</a></li>
            </ul>
          </aside>

          <section class="col-md-9 content-section">
            {{content}}
          </section>
        </div>
      </main>

      <footer class="footer-section">
        <small>&copy; 2026 Minimal Bootstrap Page</small>
      </footer>
    </div>

    <!-- Bootstrap 5 JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
