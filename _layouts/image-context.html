<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Context — Layout Recreation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <style>
      :root{
        --top-blue:#2b21ff;
        --header-orange:#ef6b58;
        --aside-left:#ffd700;
        --main-blue:#66c6ff;
        --aside-right:#ff7eb6;
        --footer-green:#9ff3a5;
      }
      html,body{height:100%;}
      body{margin:0;font-family: Georgia, 'Times New Roman', Times, serif;}

      /* Top link bar (nav) */
      .top-bar{background:var(--top-blue);color:#fff;padding:14px 0;text-align:center;font-weight:700}
      .header-bar{background:var(--header-orange);color:#1b1b1b;padding:12px 0;text-align:center;font-weight:700}

      /* Layout */
      .page-row{min-height:60vh}
      .aside-left{background:var(--aside-left);padding:2rem 1rem}
      .aside-right{background:var(--aside-right);padding:2rem 1rem}
      .main{background:var(--main-blue);padding:3rem 4rem;display:flex;align-items:flex-start}

      /* Footer */
      .page-footer{background:var(--footer-green);padding:14px 0;text-align:center;font-weight:700}

      /* Typography for the central paragraph */
      .lead-block{font-size:1.9rem;line-height:1.2;font-weight:700;color:#07121a;max-width:900px}

      /* Responsive adjustments */
      @media (max-width:767.98px){
        .main{padding:2rem 1.25rem}
        .lead-block{font-size:1.25rem;text-align:center}
        .aside-left,.aside-right{padding:1rem}
      }
    </style>
  </head>
  <body>

    <!-- Responsive Navbar with social links -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background:var(--top-blue);">
      <div class="container-fluid">
        <a class="navbar-brand mx-auto fw-bold" href="#">Link</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navSocial" aria-controls="navSocial" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navSocial">
          <ul class="navbar-nav ms-auto me-3">
            <li class="nav-item"><a class="nav-link" href="https://youtube.com/" target="_blank" rel="noopener noreferrer"><i class="lni lni-youtube"></i> YouTube</a></li>
            <li class="nav-item"><a class="nav-link" href="https://linkedin.com/" target="_blank" rel="noopener noreferrer"><i class="lni lni-linkedin-original"></i> LinkedIn</a></li>
            <li class="nav-item"><a class="nav-link" href="https://instagram.com/" target="_blank" rel="noopener noreferrer"><i class="lni lni-instagram-original"></i> Instagram</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Header bar below the nav to match image -->
    <div class="header-bar">Header</div>

    <!-- Main content with two asides -->
    <div class="container-fluid page-row">
      <div class="row g-0 h-100">
        <aside class="col-12 col-md-2 aside-left d-flex align-items-start justify-content-center">
          <div>
            <div class="h4 fw-bold">Aside 1</div>
            <div class="text-center mt-3 d-md-none"><i class="lni lni-user"></i></div>
          </div>
        </aside>

        <main class="col-12 col-md-8 main">
          <div class="mx-auto">
            <p class="lead-block">The desert sky was blood red. She held on tight, as we sped, through the Valley of the Dead Vultures, into an underworld of sub-culture.</p>
          </div>
        </main>

        <aside class="col-12 col-md-2 aside-right d-flex align-items-start justify-content-center">
          <div>
            <div class="h4 fw-bold">Aside 2</div>
            <div class="text-center mt-3 d-md-none"><i class="lni lni-star"></i></div>
          </div>
        </aside>
      </div>
    </div>

    <div class="page-footer">Footer</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
