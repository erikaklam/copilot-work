<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Replica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
  <style>
    body{font-family:Georgia,serif}
    .navy{background:#3112ff}
    .coral{background:#f35c44}
    .yellow{background:#ffd500}
    .blue{background:#56bdf5}
    .pink{background:#f15bb5}
    .green{background:#9be88d}
    .panel{min-height:32rem}
    .content-text{max-width:36rem;line-height:1.15}
  </style>
</head>
<body class="bg-white">
  <nav class="navbar navbar-expand-lg navbar-dark navy py-3">
    <div class="container-fluid justify-content-center">
      <a class="navbar-brand fw-bold fs-3" href="#">Link</a>
      <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navLinks">
          <ul class="navbar-nav gap-lg-3 text-center">
          <li class="nav-item"><a class="nav-link fw-semibold" href="https://youtube.com" target="_blank" rel="noopener"><i class="lni lni-youtube me-1"></i>YouTube</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="https://linkedin.com" target="_blank" rel="noopener"><i class="lni lni-linkedin-original me-1"></i>LinkedIn</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="hangman.html"><i class="lni lni-game-alt me-1"></i>Hangman</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold" href="block-breaker.html"><i class="lni lni-game-alt me-1"></i>Block Breaker</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="coral text-center py-3 fw-bold fs-2">Header</header>

  <main class="container-fluid px-0">
    <div class="row g-0">
      <aside class="col-12 col-md-2 yellow d-flex align-items-start justify-content-center p-4 panel order-1 order-md-1">
        <div class="fw-bold fs-2"><i class="lni lni-star-filled me-2"></i>Aside 1</div>
      </aside>
      <section class="col-12 col-md-8 blue d-flex align-items-start p-4 panel order-3 order-md-2">
        <p class="content-text fw-bold fs-3 mb-0 ms-md-4 mt-md-4">
          The desert sky was blood red. She held on tight, as we sped, through the Valley of the Dead Vultures, into an underworld of sub-culture.
        </p>
      </section>
      <aside class="col-12 col-md-2 pink d-flex align-items-start justify-content-center p-4 panel order-2 order-md-3">
        <div class="fw-bold fs-2"><i class="lni lni-heart-filled me-2"></i>Aside 2</div>
      </aside>
    </div>
  </main>

  <footer class="green text-center py-3 fw-bold fs-2">Footer</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
