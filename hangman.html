<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <style>
      body{font-family:Georgia,serif;background:#fff}
      .navy{background:#3112ff}
      .coral{background:#f35c44}
      .game-wrap{max-width:900px;margin:3rem auto}
      .word{font-size:2rem;letter-spacing:.4rem}
      .keyboard button{min-width:40px;margin:4px}
      pre.ascii{background:#f7f7f7;padding:1rem;border-radius:.25rem}
      .controls .btn{min-width:140px}
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark navy py-3">
      <div class="container-fluid justify-content-center">
        <a class="navbar-brand fw-bold fs-3" href="index.html">Back</a>
        <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navLinksHangman">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navLinksHangman">
          <ul class="navbar-nav gap-lg-3 text-center">
            <li class="nav-item"><a class="nav-link fw-semibold" href="https://youtube.com" target="_blank" rel="noopener"><i class="lni lni-youtube me-1"></i>YouTube</a></li>
            <li class="nav-item"><a class="nav-link fw-semibold" href="https://linkedin.com" target="_blank" rel="noopener"><i class="lni lni-linkedin-original me-1"></i>LinkedIn</a></li>
            <li class="nav-item"><a class="nav-link fw-semibold" href="block-breaker.html"><i class="lni lni-game-alt me-1"></i>Block Breaker</a></li>
            <li class="nav-item"><a class="nav-link fw-semibold" href="https://instagram.com" target="_blank" rel="noopener"><i class="lni lni-instagram-original me-1"></i>Instagram</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="coral text-center py-2 fw-bold">Hangman</div>

    <main class="game-wrap">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title">Hangman</h3>
          <div class="row">
            <div class="col-md-5">
              <pre class="ascii" id="hangmanArt"></pre>
              <div class="mt-3">Wrong guesses: <span id="wrongCount">0</span> / <span id="maxWrong">6</span></div>
            </div>
            <div class="col-md-7">
              <div class="mb-3">
                <div class="word" id="wordDisplay"></div>
              </div>
              <div class="keyboard mb-3" id="keyboard"></div>
              <div class="controls d-flex gap-2">
                <button id="restartBtn" class="btn btn-primary">Restart</button>
                <button id="hintBtn" class="btn btn-outline-secondary">Hint</button>
                <div class="ms-auto align-self-center text-success fw-bold" id="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const words = ["DESERT","VALLEY","VULTURE","SUBCULTURE","UNDERWORLD","SPEED","SKY"];
      const stages = [
`  +---+
  |   |
      |
      |
      |
=========`,
`  +---+
  |   |
  O   |
      |
      |
=========`,
`  +---+
  |   |
  O   |
  |   |
      |
=========`,
`  +---+
  |   |
  O   |
 /|   |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\  |
      |
=========`,
`  +---+
  |   |
  O   |
 /|\  |
 /    |
=========`,
`  +---+
  |   |
  O   |
 /|\  |
 / \  |
=========`
      ];

      let answer = '';
      let maxWrong = 6;
      let wrong = 0;
      let guessed = new Set();

      const hangmanArt = document.getElementById('hangmanArt');
      const wordDisplay = document.getElementById('wordDisplay');
      const keyboard = document.getElementById('keyboard');
      const wrongCount = document.getElementById('wrongCount');
      const maxWrongEl = document.getElementById('maxWrong');
      const restartBtn = document.getElementById('restartBtn');
      const statusEl = document.getElementById('status');
      const hintBtn = document.getElementById('hintBtn');

      function pickWord(){
        answer = words[Math.floor(Math.random()*words.length)];
      }

      function renderWord(){
        let html = '';
        for(const ch of answer){
          html += (guessed.has(ch)? ch : '_') + ' ';
        }
        wordDisplay.textContent = html.trim();
      }

      function renderKeyboard(){
        keyboard.innerHTML = '';
        for(let i=65;i<=90;i++){
          const letter = String.fromCharCode(i);
          const btn = document.createElement('button');
          btn.className = 'btn btn-outline-dark btn-sm';
          btn.textContent = letter;
          btn.disabled = guessed.has(letter) || isGameOver();
          btn.addEventListener('click', ()=>handleGuess(letter, btn));
          keyboard.appendChild(btn);
        }
      }

      function handleGuess(letter, btn){
        guessed.add(letter);
        btn.disabled = true;
        if(!answer.includes(letter)){
          wrong++;
          wrongCount.textContent = wrong;
        }
        update();
      }

      function update(){
        hangmanArt.textContent = stages[Math.min(wrong, stages.length-1)];
        renderWord();
        renderKeyboard();
        maxWrongEl.textContent = maxWrong;
        // check win
        const clean = answer.split('').every(ch=>guessed.has(ch));
        if(clean){
          statusEl.textContent = 'You win!';
        } else if(wrong>maxWrong){
          statusEl.textContent = 'You lose — answer: ' + answer;
        } else {
          statusEl.textContent = '';
        }
      }

      function isGameOver(){
        return wrong>maxWrong || answer.split('').every(ch=>guessed.has(ch));
      }

      restartBtn.addEventListener('click', ()=>{
        startGame();
      });

      hintBtn.addEventListener('click', ()=>{
        // reveal one letter
        for(const ch of answer){
          if(!guessed.has(ch)){
            guessed.add(ch);
            break;
          }
        }
        update();
      });

      function startGame(){
        pickWord();
        wrong = 0;
        guessed = new Set();
        wrongCount.textContent = wrong;
        statusEl.textContent = '';
        update();
      }

      // init
      startGame();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
